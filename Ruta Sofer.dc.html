<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/hearth-918148ab-9f4a-4472-9670-d2dff5fe19ee/hearth.css">
<script src="_ds/hearth-918148ab-9f4a-4472-9670-d2dff5fe19ee/_ds_bundle.js"></script>
<style>
body{margin:0;background:#120d0a;font-family:var(--h-font-body);color:var(--h-fg);-webkit-tap-highlight-color:transparent}
a{color:var(--h-accent-fg)}a:hover{color:var(--h-accent)}
@keyframes rt-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
[data-rt=days]{scrollbar-width:none}
[data-rt=days]::-webkit-scrollbar{display:none}
@media (min-width:520px){[data-rt=phone]{max-width:480px!important;margin:0 auto!important;min-height:100vh!important}}
@media (min-width:1000px){[data-rt=phone]{max-width:560px!important}}
</style>
</helmet>

<div data-rt="phone" style="min-height:100vh;display:flex;flex-direction:column;background:var(--h-bg-page)">

<div style="position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;background:var(--h-bg-surface);border-bottom:1px solid var(--h-line);background-image:radial-gradient(120% 100% at 0% 0%, rgba(242,166,59,.12), transparent 62%)">
<div style="display:flex;align-items:center;gap:12px">
<img src="assets/logo-alb.png" alt="Golden Pastry" style="width:36px;height:36px;object-fit:contain;flex:none">
<div style="display:flex;flex-direction:column;min-width:0;flex:1">
<span style="font-family:var(--h-font-display);font-size:20px;font-weight:600;line-height:1.2">Ruta de livrare</span>
<span style="font-size:13px;color:var(--h-fg-subtle)">{{ sub }}</span>
</div>
<span class="{{ nextCls }}" style="font-size:12px;flex:none">{{ nextLabel }}</span>
</div>

<div data-rt="days" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<button type="button" class="{{ d.cls }}" onClick="{{ d.onClick }}" style="flex:none;min-height:44px;font-size:14px;border-radius:12px">{{ d.l }}</button>
</sc-for>
</div>

<div class="h-progress" style="height:8px"><div class="h-progress__bar" style="width:{{ pct }}"></div></div>
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--h-fg-subtle)">
<span class="h-numeric">{{ doneLabel }}</span>
<span class="h-numeric" style="margin-left:auto">{{ totalKm }} · {{ totalDur }}</span>
</div>
</div>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
<div class="h-alert h-alert--success" style="margin:12px 16px 0;border-radius:14px;padding:12px 14px;font-size:15px;align-items:center;animation:rt-in .25s var(--h-ease-out)">
<p class="h-alert__title" style="margin:0;font-size:15px">{{ toast }}</p>
</div>
</sc-if>

<div data-rt="list" style="flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px 20px">

<div style="display:flex;flex-direction:column;border:1px solid var(--h-line);border-radius:18px;overflow:hidden;background:var(--h-bg-surface)">
<sc-for list="{{ stops }}" as="s" hint-placeholder-count="5">
<div style="border-bottom:1px solid var(--h-line);border-left:3px solid {{ s.border }};opacity:{{ s.op }}">
<button type="button" onClick="{{ s.onToggle }}" style="width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:0;background:{{ s.head }};text-align:left;cursor:pointer;font-family:var(--h-font-body);color:var(--h-fg)">
<span class="h-numeric" style="flex:none;width:40px;height:40px;border-radius:50%;background:{{ s.numBg }};color:{{ s.numFg }};display:flex;align-items:center;justify-content:center;font-family:var(--h-font-display);font-size:19px;font-weight:700">{{ s.num }}</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
<span style="font-size:18px;font-weight:700;line-height:1.25">{{ s.cust }}</span>
<sc-if value="{{ s.urgent }}" hint-placeholder-val="{{ false }}">
<span class="h-badge h-badge--danger" style="font-size:11px">Urgent</span>
</sc-if>
</div>
<span style="font-size:14px;color:var(--h-fg-muted);line-height:1.4">{{ s.addr }}</span>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--h-fg-subtle)">
<span class="h-numeric">{{ s.slot }}</span>
<span class="h-numeric">ETA {{ s.eta }}</span>
<span class="h-numeric">{{ s.leg }}</span>
<span class="h-numeric">{{ s.qty }} buc.</span>
</div>
</div>
<span style="flex:none;font-size:18px;color:var(--h-fg-subtle);line-height:40px">{{ s.chev }}</span>
</button>

<sc-if value="{{ s.open }}" hint-placeholder-val="{{ false }}">
<div style="padding:0 15px 15px;display:flex;flex-direction:column;gap:12px;animation:rt-in .2s var(--h-ease-out)">
<span class="h-eyebrow" style="font-size:11px">Bifează ce încarci</span>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ s.items }}" as="it" hint-placeholder-count="2">
<button type="button" onClick="{{ it.onToggle }}" style="display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid {{ it.border }};border-radius:14px;background:{{ it.bg }};cursor:pointer;font-family:var(--h-font-body);color:var(--h-fg);text-align:left">
<span style="flex:none;width:26px;height:26px;border-radius:8px;border:2px solid {{ it.boxBorder }};background:{{ it.boxBg }};color:var(--h-cocoa-800);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700">{{ it.mark }}</span>
<span class="h-numeric" style="font-size:17px;font-weight:700;min-width:34px">{{ it.q }}</span>
<span style="flex:1;font-size:16px;text-decoration:{{ it.deco }}">{{ it.n }}</span>
</button>
</sc-for>
</div>
<sc-if value="{{ s.note }}" hint-placeholder-val="{{ false }}">
<div class="h-alert h-alert--warning" style="border-radius:12px;padding:10px 12px;font-size:14px">{{ s.note }}</div>
</sc-if>
<div style="display:flex;gap:8px">
<a href="{{ s.nav }}" target="_blank" rel="noopener" class="h-btn h-btn--secondary" style="flex:1;min-height:50px;font-size:15px;text-decoration:none">Navighează</a>
<button type="button" class="h-btn h-btn--ghost" onClick="{{ s.onAll }}" style="flex:1;min-height:50px;font-size:15px">Tot încărcat</button>
</div>
<button type="button" class="{{ s.doneCls }}" onClick="{{ s.onDone }}" style="min-height:56px;font-size:17px;font-weight:700">{{ s.doneLabel }}</button>
</div>
</sc-if>
</div>
</sc-for>
</div>

<sc-if value="{{ noStops }}" hint-placeholder-val="{{ false }}">
<div data-rt="wide" class="h-card" style="padding:40px 20px;border-radius:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">
<p style="margin:0;font-size:16px;color:var(--h-fg-muted)">Nicio livrare în ziua asta.</p>
<p style="margin:0;font-size:14px;color:var(--h-fg-subtle)">Alege altă zi din capul listei.</p>
</div>
</sc-if>

<sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}">
<div data-rt="wide" class="h-alert h-alert--success" style="border-radius:16px;padding:14px;font-size:16px;align-items:center">Ruta e gata — toate comenzile au fost predate.</div>
</sc-if>

</div>

<div style="padding:12px 16px 18px;border-top:1px solid var(--h-line);background:var(--h-bg-sunk);display:flex;align-items:center;gap:10px">
<div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
<span style="font-size:13px;color:var(--h-fg-subtle);line-height:1.4">{{ orderNote }}</span>
<a href="Intrare.dc.html" style="font-size:13px;font-weight:600;text-decoration:none">← Alege panoul</a>
</div>
<button type="button" class="h-btn h-btn--ghost" onClick="{{ onReset }}" style="min-height:46px;font-size:14px;flex:none">Resetează bifele</button>
</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">
const KEY = "gp-admin-orders-v1";
const RKEY = "gp-route-order-v1";
const DKEY = "gp-driver-v1";
const HQ = { lat: 44.4306, lng: 26.1010 };
const ZONES = {
  "Centru": { lat: 44.4353, lng: 26.1025 }, "Dorobanți": { lat: 44.4550, lng: 26.0900 },
  "Aviatorilor": { lat: 44.4680, lng: 26.0870 }, "Floreasca": { lat: 44.4650, lng: 26.0980 },
  "Pipera": { lat: 44.5150, lng: 26.1150 }, "Timpuri Noi": { lat: 44.4200, lng: 26.1150 },
  "Tineretului": { lat: 44.4100, lng: 26.1050 }, "Berceni": { lat: 44.3900, lng: 26.1250 },
  "Cotroceni": { lat: 44.4300, lng: 26.0620 }, "Militari": { lat: 44.4360, lng: 26.0100 }
};
const GP_M = ["ian", "feb", "mar", "apr", "mai", "iun", "iul", "aug", "sep", "oct", "noi", "dec"];
const GP_DOW = ["Dum", "Lun", "Mar", "Mie", "Joi", "Vin", "Sâm"];
const gpPad = (n) => (n < 10 ? "0" : "") + n;
const gpIso = (d) => d.getFullYear() + "-" + gpPad(d.getMonth() + 1) + "-" + gpPad(d.getDate());
const gpToday = () => gpIso(new Date());
const gpParse = (v) => { const p = String(v).split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); };
const gpDow = (v) => GP_DOW[gpParse(v).getDay()];
const gpNum = (v) => String(gpParse(v).getDate());
const gpShort = (v) => gpDow(v) + " " + gpNum(v) + " " + GP_M[gpParse(v).getMonth()];
const gpLong = (v) => gpShort(v) + " " + gpParse(v).getFullYear();
const gpWindow = (n) => {
  const out = [], t = new Date();
  t.setHours(0, 0, 0, 0);
  for (let i = 0; i < n; i++) { const d = new Date(t); d.setDate(t.getDate() + i); out.push(gpIso(d)); }
  return out;
};
const gpShift = (days) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + days); return gpIso(d); };
const GP_LDOW = ["Duminică", "Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă"];
const gpFull = (v) => GP_LDOW[gpParse(v).getDay()] + " " + gpNum(v) + " " + GP_M[gpParse(v).getMonth()];
const DAYS = () => gpWindow(7).map(v => ({ v, l: gpDow(v) + " " + gpNum(v) }));
const SPEED = 22, SERVICE = 6;

class Component extends DCLogic {
  state = { orders: [], seq: {}, day: gpToday(), loaded: {}, open: null, toast: "" };

  componentDidMount() {
    document.documentElement.setAttribute("data-theme", "dark");
    const read = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } };
    const orders = read(KEY, []);
    const d = read(DKEY, {});
    this.setState({
      orders: Array.isArray(orders) ? orders : [],
      seq: read(RKEY, {}) || {},
      loaded: (d && d.loaded) || {},
      day: gpWindow(7).indexOf(d && d.day) !== -1 ? d.day : gpToday()
    });
  }

  persistOrders(orders) { try { localStorage.setItem(KEY, JSON.stringify(orders)); } catch (e) {} }
  persistDriver(patch) {
    const next = Object.assign({ day: this.state.day, loaded: this.state.loaded }, patch);
    try { localStorage.setItem(DKEY, JSON.stringify(next)); } catch (e) {}
    return next;
  }

  pos(o) { const z = ZONES[o.zone] || ZONES["Centru"]; return { lat: o.lat || z.lat, lng: o.lng || z.lng }; }

  km(a, b) {
    const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    const la = a.lat * Math.PI / 180, lb = b.lat * Math.PI / 180;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(la) * Math.cos(lb) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h)) * 1.35;
  }

  stopsFor(day) {
    const all = this.state.orders.filter(o => o.chan === "Livrare" && o.day === day && !o.archived);
    const order = this.state.seq[day] || [];
    const rank = {};
    order.forEach((id, i) => { rank[id] = i; });
    return all.slice().sort((a, b) => {
      const ra = rank[a.id], rb = rank[b.id];
      if (ra !== undefined && rb !== undefined) return ra - rb;
      if (ra !== undefined) return -1;
      if (rb !== undefined) return 1;
      return a.slot < b.slot ? -1 : a.slot > b.slot ? 1 : 0;
    });
  }

  qty(o) { return o.items.reduce((a, i) => a + (parseInt(i.q, 10) || 0), 0); }

  renderVals() {
    const S = this.state;
    const list = this.stopsFor(S.day);
    const mins = (t) => parseInt(String(t).slice(0, 2), 10) * 60 + parseInt(String(t).slice(3), 10);
    const hhmm = (m) => {
      const x = ((Math.round(m) % 1440) + 1440) % 1440;
      return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0");
    };
    let prev = HQ, total = 0;
    const legs = list.map(o => { const p = this.pos(o), d = this.km(prev, p); prev = p; total += d; return d; });
    let clock = list.length ? mins(list[0].slot) - legs[0] / SPEED * 60 : 0;

    const toggleItem = (o, i) => {
      const cur = (S.loaded[o.id] || []).slice();
      const at = cur.indexOf(i);
      if (at === -1) cur.push(i); else cur.splice(at, 1);
      const loaded = Object.assign({}, S.loaded, { [o.id]: cur });
      this.persistDriver({ loaded });
      this.setState({ loaded });
    };
    const allItems = (o) => {
      const full = o.items.map((_, i) => i);
      const cur = S.loaded[o.id] || [];
      const loaded = Object.assign({}, S.loaded, { [o.id]: cur.length === full.length ? [] : full });
      this.persistDriver({ loaded });
      this.setState({ loaded });
    };
    const markDone = (o) => {
      const delivered = o.status === "Predată";
      const orders = S.orders.map(x => x.id === o.id ? Object.assign({}, x, { status: delivered ? "La ambalare" : "Predată" }) : x);
      this.persistOrders(orders);
      this.setState({
        orders, open: null,
        toast: delivered ? o.cust + " — livrarea a fost anulată." : o.cust + " · " + o.ref + " marcat livrat. Laboratorul vede „Predată”."
      });
    };

    const stops = list.map((o, i) => {
      clock += legs[i] / SPEED * 60;
      const eta = hhmm(clock);
      clock += SERVICE;
      const done = o.status === "Predată";
      const lo = S.loaded[o.id] || [];
      const allLoaded = lo.length === o.items.length && o.items.length > 0;
      return {
        num: done ? "✓" : String(i + 1), ref: o.ref, cust: o.cust, slot: o.slot, eta,
        addr: (o.addr || "adresă necompletată") + " · " + (o.zone || "Centru"),
        qty: String(this.qty(o)), leg: legs[i].toFixed(1) + " km", note: o.note || "",
        urgent: !!o.urgent,
        op: done ? "0.62" : "1",
        border: o.urgent && !done ? "var(--h-jam)" : "transparent",
        head: done ? "var(--h-success-soft)" : o.urgent ? "var(--h-jam-soft)" : "transparent",
        numBg: done ? "var(--h-success)" : allLoaded ? "var(--h-honey)" : "var(--h-accent)",
        numFg: "var(--h-cocoa-800)",
        open: S.open === o.id,
        chev: S.open === o.id ? "▾" : "▸",
        onToggle: () => this.setState({ open: S.open === o.id ? null : o.id, toast: "" }),
        items: o.items.map((it, k) => {
          const on = lo.indexOf(k) !== -1;
          return {
            q: it.q, n: it.n, mark: on ? "✓" : "",
            bg: on ? "var(--h-success-soft)" : "var(--h-bg-sunk)",
            border: on ? "var(--h-success)" : "var(--h-line)",
            boxBorder: on ? "var(--h-success)" : "var(--h-fg-faint)",
            boxBg: on ? "var(--h-success)" : "transparent",
            deco: on ? "line-through" : "none",
            onToggle: () => toggleItem(o, k)
          };
        }),
        onAll: () => allItems(o),
        nav: "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent((o.addr || o.cust) + ", București"),
        doneCls: done ? "h-btn h-btn--ghost h-btn--block" : "h-btn h-btn--primary h-btn--block",
        doneLabel: done ? "Anulează livrarea" : "Marchează livrat",
        onDone: () => markDone(o)
      };
    });

    const doneCount = list.filter(o => o.status === "Predată").length;
    const next = list.find(o => o.status !== "Predată");

    return {
      sub: gpFull(S.day) + " · " + list.length + (list.length === 1 ? " oprire" : " opriri"),
      days: DAYS().map(d => ({
        l: d.l, cls: d.v === S.day ? "h-btn h-btn--primary h-btn--sm" : "h-btn h-btn--secondary h-btn--sm",
        onClick: () => { this.persistDriver({ day: d.v }); this.setState({ day: d.v, open: null, toast: "" }); }
      })),
      stops, noStops: list.length === 0,
      pct: list.length ? Math.round(doneCount / list.length * 100) + "%" : "0%",
      doneLabel: doneCount + " din " + list.length + " livrate",
      totalKm: total.toFixed(1) + " km",
      totalDur: list.length ? Math.round(total / SPEED * 60 + list.length * SERVICE) + " min" : "—",
      nextLabel: next ? "Următoarea · " + next.slot : list.length ? "Rută încheiată" : "Liber",
      nextCls: next ? "h-badge h-badge--warning" : "h-badge h-badge--success",
      allDone: list.length > 0 && !next,
      toast: S.toast,
      orderNote: S.seq[S.day] ? "Ordinea opririlor e cea setată în administrare." : "Opriri în ordinea intervalelor promise.",
      onReset: () => {
        const loaded = Object.assign({}, S.loaded);
        list.forEach(o => { delete loaded[o.id]; });
        this.persistDriver({ loaded });
        this.setState({ loaded, toast: "Bifele de încărcare au fost șterse." });
      }
    };
  }
}

</script>
</body>
</html>

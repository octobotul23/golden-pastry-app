<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/hearth-918148ab-9f4a-4472-9670-d2dff5fe19ee/hearth.css">
<script src="_ds/hearth-918148ab-9f4a-4472-9670-d2dff5fe19ee/_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--h-cocoa-800);font-family:var(--h-font-body);color:var(--h-cream-100)}
a{color:var(--h-accent)}a:hover{color:var(--h-honey)}
[data-pv=bar]{scrollbar-width:none}
[data-pv=bar]::-webkit-scrollbar{display:none}
@media (max-width:760px){
[data-pv=top]{flex-direction:column!important;align-items:stretch!important;gap:10px!important}
[data-pv=bar]{width:100%!important;overflow-x:auto!important}
}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;background-image:radial-gradient(80% 50% at 50% 0%, rgba(242,166,59,.12), transparent 70%)">

<div data-pv="top" style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.12)">
<div style="display:flex;flex-direction:column;gap:2px;flex:none">
<span style="font-family:var(--h-font-display);font-size:19px;font-weight:600">Previzualizare</span>
<span style="font-size:13px;color:rgba(255,255,255,.55)">{{ note }}</span>
</div>

<div data-pv="bar" style="display:flex;gap:6px;margin-left:auto;flex:none">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
<button type="button" class="{{ p.cls }}" onClick="{{ p.onClick }}" style="min-height:44px;flex:none;font-size:14px;border-radius:12px">{{ p.label }}</button>
</sc-for>
</div>

<div data-pv="bar" style="display:flex;gap:6px;flex:none">
<sc-for list="{{ devices }}" as="d" hint-placeholder-count="3">
<button type="button" class="{{ d.cls }}" onClick="{{ d.onClick }}" style="min-height:44px;flex:none;font-size:14px;border-radius:12px">{{ d.label }}</button>
</sc-for>
</div>

<a href="{{ src }}" target="_blank" rel="noopener" class="h-btn h-btn--ghost" style="min-height:44px;font-size:14px;flex:none;text-decoration:none;color:var(--h-cream-100)">Deschide întreg →</a>
</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px 30px;overflow:auto">
<span class="h-numeric" style="font-size:13px;color:rgba(255,255,255,.5)">{{ dims }}</span>
<div style="width:{{ boxW }};height:{{ boxH }};flex:none">
<div style="width:{{ frameW }};height:{{ frameH }};transform:scale({{ scale }});transform-origin:top left;padding:{{ pad }};border-radius:{{ radius }};background:#0B0705;border:1px solid rgba(255,255,255,.16);box-sizing:border-box">
<iframe src="{{ src }}" title="Previzualizare" style="width:100%;height:100%;border:0;border-radius:{{ innerRadius }};background:var(--h-cream-200);display:block"></iframe>
</div>
</div>
</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
const PAGES = [
  { label: "Intrare", src: "Intrare.dc.html" },
  { label: "Administrare", src: "Administrare%20Comenzi.dc.html" },
  { label: "Laborator", src: "Panou%20Laborator.dc.html" },
  { label: "Rută șofer", src: "Ruta%20Sofer.dc.html" }
];
const DEVICES = [
  { label: "Telefon", w: 390, h: 844, pad: 10, radius: 42 },
  { label: "Tabletă", w: 834, h: 1112, pad: 12, radius: 26 },
  { label: "Laptop", w: 1440, h: 900, pad: 8, radius: 14 }
];

class Component extends DCLogic {
  state = { page: 1, device: 0, vw: 1200, vh: 800 };

  componentDidMount() {
    document.documentElement.setAttribute("data-theme", "dark");
    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    this.onResize();
    window.addEventListener("resize", this.onResize);
  }

  componentWillUnmount() { window.removeEventListener("resize", this.onResize); }

  renderVals() {
    const S = this.state;
    const d = DEVICES[S.device];
    const p = PAGES[S.page];
    const fw = d.w + d.pad * 2, fh = d.h + d.pad * 2;
    const availW = Math.max(280, S.vw - 60);
    const availH = Math.max(320, S.vh - 170);
    const scale = Math.min(1, availW / fw, availH / fh);

    return {
      note: "Aceleași pagini, la lățimi diferite de ecran",
      pages: PAGES.map((x, i) => ({
        label: x.label,
        cls: i === S.page ? "h-btn h-btn--primary h-btn--sm" : "h-btn h-btn--secondary h-btn--sm",
        onClick: () => this.setState({ page: i })
      })),
      devices: DEVICES.map((x, i) => ({
        label: x.label,
        cls: i === S.device ? "h-btn h-btn--honey h-btn--sm" : "h-btn h-btn--secondary h-btn--sm",
        onClick: () => this.setState({ device: i })
      })),
      src: p.src,
      dims: d.label + " · " + d.w + " × " + d.h + (scale < 1 ? " · " + Math.round(scale * 100) + "%" : ""),
      frameW: fw + "px", frameH: fh + "px",
      boxW: Math.round(fw * scale) + "px", boxH: Math.round(fh * scale) + "px",
      scale: scale.toFixed(3),
      pad: d.pad + "px",
      radius: d.radius + "px",
      innerRadius: Math.max(4, d.radius - d.pad) + "px"
    };
  }
}

</script>
</body>
</html>

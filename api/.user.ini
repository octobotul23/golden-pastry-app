; Golden Pastry — cât de mare poate fi o poză urcată din Catalog.
;
; Perechea blocului `<IfModule php_module>` din api/.htaccess, pentru cazul în
; care PHP nu mai rulează ca modul de Apache, ci prin FPM sau CGI: atunci
; `php_value` din .htaccess nu se mai aplică (și fără paza `<IfModule>` ar
; răspunde 500 la tot), iar fișierul ăsta rămâne singurul care vorbește. Pe
; mod_php, pe dos: .htaccess se aplică, iar fișierul ăsta nu e citit de nimeni.
; Deci cele două nu se calcă niciodată pe picioare — se acoperă unul pe altul.
;
; Măsurat sub SAPI-ul cgi-fcgi: se aplică amândouă rândurile, `post_max_size`
; inclusiv (el e PHP_INI_PERDIR, adică exact ce poate un .user.ini).
;
; Cifrele se ridică AMÂNDOUĂ, și se țin PESTE promisiunea panoului — 5 MB,
; `POZA_MAX_OCTETI` din api/lib/poze.php. Pricina întreagă e scrisă acolo și în
; .htaccess: ridicate peste promisiune, regula casei rămâne singura care spune
; „nu", cu vorba ei bună, în loc de eroarea seacă a lui PHP.

upload_max_filesize = 6M
post_max_size = 8M

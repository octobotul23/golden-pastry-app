; Golden Pastry — cât de mare poate fi o poză urcată din Catalog.
;
; Perechea blocului `<IfModule php_module>` din api/.htaccess, pentru cazul în
; care PHP nu rulează ca modul de Apache, ci prin FPM sau CGI: atunci
; `php_value` din .htaccess nu se mai aplică (și fără paza `<IfModule>` ar
; răspunde 500 la tot), iar fișierul ăsta rămâne singurul care vorbește. Pe
; mod_php, pe dos: .htaccess se aplică, iar fișierul ăsta nu e citit de nimeni.
; Deci cele două nu se calcă niciodată pe picioare — se acoperă unul pe altul.
;
; PE VPS-UL NOSTRU NU ĂSTA LUCREAZĂ, CI .HTACCESS-UL — și merită scris
; anume, fiindcă o vreme a scris aici pe dos. Casa se instalează pe Apache
; cu mod_php: `instaleaza-vps.sh` pune `apache2` și `libapache2-mod-php`, și
; se OPREȘTE dacă portul 80 e ținut de altcineva („Aplicația are nevoie de
; Apache pe 80"); `docs/08-publicare-vps-hostinger.md` spune din titlu
; „Ubuntu + Apache" și lămurește de ce nginx nu e o alegere aici: tot ce ține
; rutele aplicației e scris în .htaccess, pe care nginx nu-l citește.
;
; Deci fișierul ăsta e pentru ZIUA în care PHP s-ar muta pe FPM ori CGI — nu
; pentru azi. Pe mod_php nu-l citește nimeni, și e bine așa.
;
; Măsurat sub SAPI-ul cgi-fcgi: se aplică amândouă rândurile, `post_max_size`
; inclusiv (el e PHP_INI_PERDIR, adică exact ce poate un .user.ini).
;
; Cifrele se ridică AMÂNDOUĂ, și se țin PESTE promisiunea panoului — 10 MB,
; `POZA_MAX_OCTETI` din api/lib/poze.php. Pricina întreagă e scrisă acolo și în
; .htaccess: ridicate peste promisiune, regula casei rămâne singura care spune
; „nu", cu vorba ei bună, în loc de eroarea seacă a lui PHP.
;
; ȘI MAI E UN PRAG PE CARE FIȘIERUL ĂSTA NU L-AR PUTEA ATINGE — dar numai pe
; nginx: `client_max_body_size`, implicit 1M, taie cererea ÎNAINTE ca PHP să
; existe și răspunde 413 fără nimic în el. Pe Apache nu e nimic de ridicat
; (`LimitRequestBody` e 0, adică nemărginit, și nimeni nu-l schimbă la noi).
; Cine are de aflat pe ce stă chiar serverul lui deschide api/verifica.php,
; rândul „Plafonul serverului web": el citește SERVER_SOFTWARE și scrie
; comanda numai dacă e cazul.

upload_max_filesize = 11M
post_max_size = 13M
